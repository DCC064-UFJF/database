version: '3.8'

services:
  mongo1:
    container_name: mongo1
    image: mongo:latest
    command: ["/usr/bin/mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - mongo_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  mongo2:
    container_name: mongo2
    image: mongo:latest
    command: ["/usr/bin/mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - mongo_network
    depends_on:
      - mongo1
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  mongo3:
    container_name: mongo3
    image: mongo:latest
    command: ["/usr/bin/mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - mongo_network
    depends_on:
      - mongo1
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  mongo-init:
    image: mongo:latest
    restart: "no"
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    networks:
      - mongo_network
    command: >
      sh -c "sleep 20 && mongosh --host mongo1:27017 --eval '
        config = {
          \"_id\": \"rs0\",
          \"members\": [
            {\"_id\": 0, \"host\": \"mongo1:27017\"},
            {\"_id\": 1, \"host\": \"mongo2:27017\"},
            {\"_id\": 2, \"host\": \"mongo3:27017\"}
          ]
        };
        rs.initiate(config);'"

  flask-app:
    container_name: flask-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - mongo_network
    depends_on:
      - mongo1
      - mongo2
      - mongo3

networks:
  mongo_network:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data: